name: Aggiornamento settimanale

# Ogni lunedi' alle 06:00 UTC (07:00 o 08:00 in Italia) rilegge le fonti pubbliche che si possono riscaricare
# (carta dei vini Winerim, catalogo Tannico, voti, prezzi dei produttori), riscrive il sito e, se qualcosa e'
# cambiato, lo pubblica su main (GitHub Pages serve la cartella docs/).
# Il lavoro vero e' in src/aggiorna_settimanale.py: si puo' lanciare uguale anche sul proprio computer.
# Il delivery di Peck (serve il login) non si tocca mai.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      scarica_voti_aperti:
        description: "Scarica i dataset dei voti aperti (Wine Enthusiast, X-Wines) se non sono nella cache"
        type: boolean
        default: false
      voti_enoteche:
        description: "Aggiorna anche i voti dei negozi (src/voti_enoteche.py)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-settimanale
  cancel-in-progress: false

jobs:
  aggiorna:
    if: github.repository == 'AndreottiVIII/peck-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa i pacchetti
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          if [ "${{ inputs.scarica_voti_aperti }}" = "true" ]; then pip install gdown; fi

      # I dati scaricati (data/raw, fuori da git) restano fra una settimana e l'altra: cosi' si scaricano solo
      # le novita' (schede dei vini nuovi, schede Tannico nuove). Ogni volta si salva una cache nuova.
      - name: Recupera la cache dei dati scaricati
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/winerim
            data/raw/tannico
            data/raw/voti
            data/raw/prodotto_*.html
            data/raw/elenco_*.html
            !data/raw/voti/xwines/*.zip
            !data/raw/voti/xwines/*.pdf
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-

      # src/sito.py scrive nella pagina «Come funziona» la data di modifica di data/link_controllati.csv: dopo
      # il checkout sarebbe sempre quella di oggi. Si rimette la data dell'ultimo commit che l'ha cambiato.
      - name: Data del controllo dei link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(gh api "repos/${{ github.repository }}/commits?path=data/link_controllati.csv&per_page=1" --jq '.[0].commit.committer.date' || true)
          if [ -n "$d" ] && [ -f data/link_controllati.csv ]; then touch -d "$d" data/link_controllati.csv; echo "link_controllati.csv: $d"; fi

      - name: Aggiorna dati e sito
        timeout-minutes: 56
        env:
          VOTI_ENOTECHE: ${{ (inputs.voti_enoteche && 'si') || vars.VOTI_ENOTECHE || 'no' }}
        run: python -I src/aggiorna_settimanale.py ${{ inputs.scarica_voti_aperti && '--scarica-voti-aperti' || '' }}

      - name: Salva la cache dei dati scaricati
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/winerim
            data/raw/tannico
            data/raw/voti
            data/raw/prodotto_*.html
            data/raw/elenco_*.html
            !data/raw/voti/xwines/*.zip
            !data/raw/voti/xwines/*.pdf
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          # docs/sitemap.xml cambia ogni giorno (lastmod = oggi): da solo non conta come modifica
          altre=$(git diff --cached --name-only | grep -v '^docs/sitemap.xml$' || true)
          if [ -z "$altre" ]; then
            echo "Nessuna modifica ai dati o al sito: niente da pubblicare."
            exit 0
          fi
          echo "$altre" | head -20
          git commit -m "Aggiornamento settimanale dei prezzi ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # i push fatti col token del workflow non sempre fanno ripartire Pages: lo chiediamo esplicitamente
              curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
              exit 0
            fi
            sleep 20
          done
          echo "::error::push non riuscito (qualcuno ha cambiato main nel frattempo?)"
          exit 1
